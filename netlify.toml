# Configuration de déploiement Netlify — Jolie Création
#
# Le site est statique : rien à construire. Seules les fonctions
# serverless sont bundlées, car elles seules ont besoin du fichier
# catalogue.js situé à la racine.
#
# Variables d'environnement à renseigner dans Netlify
# (Site settings -> Environment variables), jamais dans le dépôt :
#
#   Paiement en ligne
#   SUMUP_API_KEY       = sup_sk_... (tableau de bord SumUp -> Clés API)
#   SUMUP_MERCHANT_CODE = le code marchand du compte SumUp
#
#   Envoi des devis et des commandes (SMTP Infomaniak)
#   SMTP_USER     = info@jolie-creation.com
#   SMTP_PASSWORD = le mot de passe de cette boîte
#   SMTP_HOST     = mail.infomaniak.com   (facultatif, valeur par défaut)
#   SMTP_PORT     = 465                   (facultatif, valeur par défaut)

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  # esbuild embarque catalogue.js dans le bundle de chaque fonction,
  # bien qu'il se trouve en dehors du dossier functions.
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Anciennes adresses : redirections permanentes plutôt que de simples
# pages de rafraîchissement, pour que les moteurs transfèrent vraiment
# l'historique de l'URL. force = true fait passer la règle devant le
# fichier statique de même nom, qui reste le repli hors Netlify.
[[redirects]]
  from = "/evenements.html"
  to = "/mes-realisations.html"
  status = 301
  force = true

[[redirects]]
  from = "/creations.html"
  to = "/biscuits-personnalises.html"
  status = 301
  force = true

[[redirects]]
  from = "/formules.html"
  to = "/micro-scenographies.html"
  status = 301
  force = true

[[redirects]]
  from = "/mini-scenographies.html"
  to = "/micro-scenographies.html"
  status = 301
  force = true
